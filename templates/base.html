@'
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}المتجر{% endblock %}</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; background: #f7f7f7; color: #222; }
        header { background: #1f2937; color: #fff; padding: 14px 24px; }
        header a { color: #fff; text-decoration: none; margin-left: 18px; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; background: #eee; }
        .price { color: #047857; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'catalog:home' %}">الرئيسية</a>
        <a href="/admin/">لوحة التحكم</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
'@ | Set-Content -Path templates\base.html -Encoding utf8
